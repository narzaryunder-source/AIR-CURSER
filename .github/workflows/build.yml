name: Build APK

on:
  push:
    branches: [ main ]
    # The Ubuntu scripts are not part of the APK: no new release for them.
    paths-ignore:
      - 'ubuntu/**'
      # BrightMax has its own workflow (brightmax.yml).
      - 'brightmax/**'
      - '.github/workflows/brightmax.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Run unit tests
        run: ./gradlew --no-daemon --stacktrace testDebugUnitTest

      - name: Build debug APK
        run: ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Prepare APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/AirCursor.apk
          cp app/build/outputs/apk/debug/app-debug.apk "out/AirCursor-v${{ github.run_number }}.apk"
          ls -la out

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AirCursor-v${{ github.run_number }}
          path: out/AirCursor-v${{ github.run_number }}.apk

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/

      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: AirCursor v${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: |
            Debug APK built from ${{ github.sha }}.
            Phone par neeche **Assets** me `AirCursor.apk` par tap karo, download hoga, phir install karo.
          files: out/AirCursor.apk
