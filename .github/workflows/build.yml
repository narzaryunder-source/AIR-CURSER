name: Build APK

on:
  push:
    branches: [ main ]
    # The PC scripts in ubuntu/ are bundled in the APK, so they do make a new release.
    paths-ignore:
      # BrightMax has its own workflow (brightmax.yml).
      - 'brightmax/**'
      - '.github/workflows/brightmax.yml'
      # Live Pro plan settings and business docs: changed from the phone, no new APK needed.
      - 'cloudpc/**'
      - 'docs/**'
      # The ready-made PC image has its own workflow (pc-image.yml).
      - 'pcimage/**'
      - '.github/workflows/pc-image.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true   # third_party/whisper.cpp (offline voice)

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Install NDK and CMake (offline voice)
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;29.0.14206865" "cmake;3.31.6" > /dev/null

      - name: Run unit tests
        run: ./gradlew --no-daemon --stacktrace testDebugUnitTest

      - name: Build debug APK
        run: ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Prepare APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/AirCursor.apk
          cp app/build/outputs/apk/debug/app-debug.apk "out/AirCursor-v${{ github.run_number }}.apk"
          ls -la out

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AirCursor-v${{ github.run_number }}
          path: out/AirCursor-v${{ github.run_number }}.apk

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/

      - name: Keep the APK for the release
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: out/AirCursor.apk

  # The same tested Windows artifact is used for development builds and release assembly.
  windows:
    uses: ./.github/workflows/windows-workspace.yml

  release:
    if: github.ref == 'refs/heads/main' && always() && needs.build.result == 'success'
    needs: [build, windows]
    runs-on: ubuntu-latest
    steps:
      - name: Get the builds
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: out
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: AirCursor v${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: |
            Debug APK built from ${{ github.sha }}.
            Phone par neeche **Assets** me `AirCursor.apk` par tap karo, download hoga, phir install karo.
            Computer (Windows) ke liye: `AirCursor-Windows.exe`.
          files: |
            out/AirCursor.apk
            out/AirCursor-Windows.exe
