name: Compare AirCursor MP4 trimming on Windows
on: workflow_dispatch
permissions:
  contents: read
jobs:
  compare:
    runs-on: windows-2025
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: desktop/requirements*.txt
      - run: python -m pip install -r desktop/requirements.txt imageio-ffmpeg==0.6.0
      - run: python desktop/tools/compare_trim.py
