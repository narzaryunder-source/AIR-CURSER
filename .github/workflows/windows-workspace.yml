name: AirCursor Windows workspace
on:
  push:
    branches: ['windows/**']
    paths: ['desktop/**', '.github/workflows/windows-workspace.yml', '.github/workflows/build.yml']
  workflow_dispatch:
    inputs:
      verify_package_lifecycle:
        description: 'Approve installing, launching, upgrading and removing fd on the disposable runner'
        type: boolean
        default: false
  workflow_call:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: desktop/requirements*.txt
      - name: Install dependencies
        run: python -m pip install -r desktop/requirements-build.txt
      - name: Windows unit and integration tests
        env:
          AIRCURSOR_TEST_WEBENGINE: "1"
        run: python -m pytest -q desktop/tests
      - name: Verify an approved real winget package lifecycle
        if: github.event_name == 'workflow_dispatch' && inputs.verify_package_lifecycle
        env:
          AIRCURSOR_APPROVE_LIFECYCLE: '1'
        run: python desktop/tools/verify_winget.py
      - name: Build the Windows x64 installer
        shell: pwsh
        run: |
          $nsis = "${env:ProgramFiles(x86)}\NSIS\makensis.exe"
          if (-not (Test-Path $nsis)) { choco install nsis --yes --no-progress }
          python desktop/packaging/build.py --nsis $nsis
      - name: Verify installer upgrade, uninstall and packaged GUI startup
        shell: pwsh
        run: |
          $previous = Join-Path $env:RUNNER_TEMP 'AirCursor-Windows-previous.exe'
          curl.exe --fail --location --retry 3 --output $previous https://github.com/narzaryunder-source/AIR-CURSER/releases/download/windows-v2.3.0-rc.1/AirCursor-Windows.exe
          if ($LASTEXITCODE -or (Get-FileHash $previous -Algorithm SHA256).Hash -ne '69abe34f0a052e589a209849c2b2bad02dc7f5f007ea4991f7b2dc302095b443') { throw 'Previous installer verification failed' }
          if ((Get-Item desktop/dist/AirCursor-Windows.exe).Length -gt (Get-Item $previous).Length + 2MB) { throw 'The installer exceeds its size budget' }
          ./desktop/tools/verify_install.ps1 -Installer desktop/dist/AirCursor-Windows.exe -PreviousInstaller $previous -PreviousVersion 2.3.0
          Copy-Item "$env:TEMP/aircursor-selftest.txt" desktop/dist/aircursor-selftest.txt
      - name: Verify Windows full-screen taskbar behavior
        run: python desktop/tools/verify_fullscreen.py
      - name: Capture the Windows desktop and application windows
        shell: pwsh
        run: |
          if (Get-Command Set-DisplayResolution -ErrorAction SilentlyContinue) {
            Set-DisplayResolution -Width 1920 -Height 1080 -Force -ErrorAction Continue
          }
          python desktop/tools/capture.py --output desktop/dist/windows-rendering
      - uses: actions/upload-artifact@v4
        with:
          name: windows-rendering
          path: desktop/dist/windows-rendering/
          if-no-files-found: error
      - name: Record Windows responsiveness and receiver measurements
        shell: pwsh
        run: |
          foreach ($mode in @('off', 'on', 'on', 'off')) {
            python desktop/tools/compare_low_memory.py $mode | Tee-Object -FilePath desktop/dist/low-memory.jsonl -Append
            if ($LASTEXITCODE) { throw 'Low-memory benchmark failed' }
          }
          git fetch --depth=1 origin refs/tags/windows-v2.2.2
          if ($LASTEXITCODE) { throw 'Could not fetch the Windows 2.2.2 baseline' }
          git worktree add --detach "$env:RUNNER_TEMP/aircursor-baseline" FETCH_HEAD
          if ($LASTEXITCODE) { throw 'Could not check out the benchmark baseline' }
          foreach ($mode in @('startup', 'receiver', 'policy', 'association', 'dock', 'materials', 'tabs', 'workspace', 'store', 'catalog', 'settings_write', 'ai_reply', 'photo_export')) {
            python desktop/tools/benchmark.py $mode --source "$env:RUNNER_TEMP/aircursor-baseline/desktop" | Tee-Object -FilePath desktop/dist/benchmarks-v2.2.2.jsonl -Append
            if ($LASTEXITCODE) { throw "Baseline benchmark failed for $mode" }
            python desktop/tools/benchmark.py $mode | Tee-Object -FilePath desktop/dist/benchmarks.jsonl -Append
            if ($LASTEXITCODE) { throw "Benchmark failed for $mode" }
          }
          python desktop/tools/benchmark.py policy --notification | Tee-Object -FilePath desktop/dist/benchmarks.jsonl -Append
          if ($LASTEXITCODE) { throw 'Network notification benchmark failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: desktop/dist/AirCursor-Windows.exe
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: windows-verification
          path: |
            desktop/dist/SHA256SUMS.txt
            desktop/dist/package-size.json
            desktop/dist/low-memory.jsonl
            desktop/dist/aircursor-selftest.txt
            desktop/dist/benchmarks.jsonl
            desktop/dist/benchmarks-v2.2.2.jsonl


  compatibility:
    name: Installed runtime on Windows Server 2022
    needs: windows
    runs-on: windows-2022
    timeout-minutes: 12
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-windows
          path: installer
      - name: Exercise the bundled runtime on the older Windows graphics stack
        shell: pwsh
        run: |
          $setup = Start-Process installer/AirCursor-Windows.exe -ArgumentList '/S' -PassThru -Wait
          if ($setup.ExitCode) { throw "Installer returned $($setup.ExitCode)" }
          $exe = "$env:LOCALAPPDATA\Programs\AirCursor\AirCursor.exe"
          $app = Start-Process $exe -ArgumentList '--self-test' -PassThru
          if (-not $app.WaitForExit(120000)) { throw 'Installed GUI timed out' }
          $report = Get-Content "$env:TEMP\aircursor-selftest.txt"
          $report
          if ($app.ExitCode -ne 0 -or $report[-1] -ne 'OK') { throw 'Installed runtime check failed' }
