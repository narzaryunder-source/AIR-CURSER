name: Verify a real Air AI app launch in the active Windows session
on: workflow_dispatch
permissions:
  contents: read
jobs:
  launch:
    runs-on: windows-2025
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: desktop/requirements*.txt
      - run: python -m pip install -r desktop/requirements.txt
      - run: python desktop/tools/verify_local_launch.py
