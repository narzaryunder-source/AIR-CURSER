name: AirCursor Windows workspace
on:
  push:
    branches: ['windows/**']
    paths: ['desktop/**', '.github/workflows/windows-workspace.yml', '.github/workflows/build.yml']
  workflow_dispatch:
    inputs:
      verify_package_lifecycle:
        description: 'Approve installing, launching, upgrading and removing fd on the disposable runner'
        type: boolean
        default: false
  workflow_call:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: desktop/requirements*.txt
      - name: Install dependencies
        run: python -m pip install -r desktop/requirements-build.txt
      - name: Windows unit and integration tests
        env:
          AIRCURSOR_TEST_WEBENGINE: "1"
        run: python -m pytest -q desktop/tests
      - name: Verify an approved real winget package lifecycle
        if: github.event_name == 'workflow_dispatch' && inputs.verify_package_lifecycle
        env:
          AIRCURSOR_APPROVE_LIFECYCLE: '1'
        run: python desktop/tools/verify_winget.py
      - name: Capture the Windows desktop and application windows
        shell: pwsh
        run: |
          if (Get-Command Set-DisplayResolution -ErrorAction SilentlyContinue) {
            Set-DisplayResolution -Width 1920 -Height 1080 -Force -ErrorAction Continue
          }
          python desktop/tools/capture.py --output desktop/dist/windows-rendering
      - uses: actions/upload-artifact@v4
        with:
          name: windows-rendering
          path: desktop/dist/windows-rendering/
          if-no-files-found: error
      - name: Record Windows responsiveness and receiver measurements
        shell: pwsh
        run: |
          foreach ($mode in @('startup', 'receiver', 'policy')) {
            python desktop/tools/benchmark.py $mode | Tee-Object -FilePath desktop/dist/benchmarks.jsonl -Append
            if ($LASTEXITCODE) { throw "Benchmark failed for $mode" }
          }
          python desktop/tools/benchmark.py policy --notification | Tee-Object -FilePath desktop/dist/benchmarks.jsonl -Append
      - name: Build the Windows x64 installer
        shell: pwsh
        run: |
          $nsis = "${env:ProgramFiles(x86)}\NSIS\makensis.exe"
          if (-not (Test-Path $nsis)) { choco install nsis --yes --no-progress }
          python desktop/packaging/build.py --nsis $nsis
      - name: Install as current user and launch the packaged GUI and web engine
        shell: pwsh
        run: |
          $installer = Start-Process desktop/dist/AirCursor-Windows.exe -ArgumentList '/S' -PassThru -Wait
          if ($installer.ExitCode) { throw "Installer returned $($installer.ExitCode)" }
          $app = "$env:LOCALAPPDATA\Programs\AirCursor\AirCursor.exe"
          $test = Start-Process $app -ArgumentList '--self-test' -PassThru
          if (-not $test.WaitForExit(120000)) { throw "Installed application timed out" }
          $log = Get-Content "$env:TEMP\aircursor-selftest.txt"
          $log
          Copy-Item "$env:TEMP\aircursor-selftest.txt" desktop/dist/aircursor-selftest.txt
          if ($test.ExitCode -ne 0 -or $log[-1] -ne 'OK') { throw "Installed application self-test failed" }
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: desktop/dist/AirCursor-Windows.exe
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: windows-verification
          path: |
            desktop/dist/SHA256SUMS.txt
            desktop/dist/aircursor-selftest.txt
            desktop/dist/benchmarks.jsonl


  compatibility:
    name: Installed runtime on Windows Server 2022
    needs: windows
    runs-on: windows-2022
    timeout-minutes: 12
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-windows
          path: installer
      - name: Exercise the bundled runtime on the older Windows graphics stack
        shell: pwsh
        run: |
          $setup = Start-Process installer/AirCursor-Windows.exe -ArgumentList '/S' -PassThru -Wait
          if ($setup.ExitCode) { throw "Installer returned $($setup.ExitCode)" }
          $exe = "$env:LOCALAPPDATA\Programs\AirCursor\AirCursor.exe"
          $app = Start-Process $exe -ArgumentList '--self-test' -PassThru
          if (-not $app.WaitForExit(120000)) { throw 'Installed GUI timed out' }
          $report = Get-Content "$env:TEMP\aircursor-selftest.txt"
          $report
          if ($app.ExitCode -ne 0 -or $report[-1] -ne 'OK') { throw 'Installed runtime check failed' }
