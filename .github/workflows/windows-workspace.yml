name: Record Air Browser with public sites on Windows
on: workflow_dispatch
permissions:
  contents: read
jobs:
  capture:
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: desktop/requirements*.txt
      - run: python -m pip install -r desktop/requirements.txt
      - name: Capture the released Windows workspace
        shell: pwsh
        run: |
          if (Get-Command Set-DisplayResolution -ErrorAction SilentlyContinue) {
            Set-DisplayResolution -Width 1920 -Height 1080 -Force -ErrorAction Continue
          }
          python desktop/tools/record_live_browser.py
          if ($LASTEXITCODE) { throw 'Recording failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: aircursor-live-browser-frames
          path: performance-frames/
          if-no-files-found: error
          retention-days: 7
