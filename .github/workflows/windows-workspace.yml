name: Live Windows browser latency
on: workflow_dispatch
permissions:
  contents: read
jobs:
  compare:
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: desktop/requirements*.txt
      - run: python -m pip install -r desktop/requirements.txt
      - shell: pwsh
        run: |
          git fetch --depth=1 origin refs/tags/windows-v2.2.2
          git worktree add --detach "$env:RUNNER_TEMP/old" FETCH_HEAD
          foreach ($mode in @('desktop','standalone','standalone','desktop')) {
            $source = if ($mode -eq 'desktop') {"$env:RUNNER_TEMP/old/desktop"} else {"$pwd/desktop"}
            python desktop/tools/live_latency.py $source $mode
            if ($LASTEXITCODE) { throw "Browser comparison failed" }
          }
