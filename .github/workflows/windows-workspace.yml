name: AirCursor Windows performance confirmation
on: workflow_dispatch
permissions:
  contents: read
jobs:
  browser:
    runs-on: windows-2025
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: desktop/requirements*.txt
      - run: python -m pip install -r desktop/requirements-build.txt
      - name: Compare first browser page across fresh processes
        shell: pwsh
        run: |
          $old = "$env:RUNNER_TEMP/aircursor-baseline"
          git fetch --depth=1 origin refs/tags/windows-v2.2.1
          if ($LASTEXITCODE) { throw 'Could not fetch baseline source' }
          git worktree add --detach $old FETCH_HEAD
          if ($LASTEXITCODE) { throw 'Could not check out baseline source' }
          foreach ($repeat in @(1, 2, 3, 4)) {
            $labels = if ($repeat % 2) { @('baseline', 'current') } else { @('current', 'baseline') }
            foreach ($label in $labels) {
              $source = if ($label -eq 'baseline') { "$old/desktop" } else { "$pwd/desktop" }
              foreach ($mode in @('tabs', 'materials')) {
                python desktop/tools/benchmark.py $mode --source $source | Tee-Object -FilePath "$label.jsonl" -Append
                if ($LASTEXITCODE) { throw "Failed $mode for $label, repetition $repeat" }
              }
            }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: browser-and-materials-comparison
          path: |
            baseline.jsonl
            current.jsonl
          if-no-files-found: error
