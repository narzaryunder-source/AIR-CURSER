name: Verify native Windows full screen
on: workflow_dispatch
permissions:
  contents: read
jobs:
  fullscreen:
    runs-on: windows-2025
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: desktop/requirements*.txt
      - run: python -m pip install -r desktop/requirements.txt
      - run: python desktop/tools/verify_fullscreen.py
      - run: python desktop/tools/compare_low_memory.py off
      - run: python desktop/tools/compare_low_memory.py on
