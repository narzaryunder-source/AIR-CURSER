name: Encode Windows browser recording
on: workflow_dispatch
permissions:
  contents: write
  actions: read
jobs:
  encode:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          run-id: 46155893889
          github-token: ${{ github.token }}
          name: aircursor-live-browser-frames
          path: frames
      - name: Encode and attach the Windows recording
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          gh release view windows-v2.3.0-rc.1 --json isDraft,targetCommitish | jq -e '.isDraft and .targetCommitish=="18a0e685aeaa61d10e4a3a166993676ae7082842"'
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          python -m pip install Pillow
          python desktop/tools/encode_live_browser.py frames Air-Browser-Windows.mp4
          ffmpeg -v error -xerror -i Air-Browser-Windows.mp4 -f null -
          ffprobe -v error -show_entries format=duration -of compact Air-Browser-Windows.mp4
          cp frames/capture.json Air-Browser-recording.json
          gh release upload windows-v2.3.0-rc.1 Air-Browser-Windows.mp4 Air-Browser-recording.json --clobber
