# Air Drive – Cloudflare Worker settings. See README.md (step 5).
name = "aircursor-airdrive"
main = "worker.js"
compatibility_date = "2026-10-01"

[vars]
# Same text as "publicKey" in cloudpc/pro.json (Owner tools in the app shows it).
SELLER_PUBLIC_KEY = ""
# Cloudflare dashboard → R2 → right side: "Account ID".
ACCOUNT_ID = ""
BUCKET = "aircursor-drive"
# R2 → Manage API tokens → your token's "Access Key ID" (the secret goes in with `wrangler secret put`).
PARENT_ACCESS_KEY_ID = ""
SEATS = "40"
QUOTA_GB = "100"

[[r2_buckets]]
binding = "DRIVE"
bucket_name = "aircursor-drive"

[[kv_namespaces]]
binding = "USERS"
# `npx wrangler kv namespace create USERS` prints this id.
id = ""
